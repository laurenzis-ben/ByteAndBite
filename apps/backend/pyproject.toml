[project]
name = "byteandbite-backend"
version = "0.1.0"
description = "ByteAndBite Backend – Rezept-Pipeline, Agent-Tools und Datenbank-Schicht"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.34.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "requests>=2.33.1",
    "beautifulsoup4>=4.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.uv]
package = false
